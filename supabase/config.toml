# healthapp lives inside the conductor Supabase project (MIN-4449, decision 1).
# This file holds [functions.*] entries only. It is NEVER pushed:
# no `supabase link`, no `supabase config push`, no `db push|pull|reset`.
# Deploy one function by name:
#   supabase functions deploy healthapp-hello --project-ref fnbnhvgrnkrbsrwhgcgc --no-verify-jwt
# Never `--prune` (it would delete conductor's own functions).

[functions.healthapp-hello]
verify_jwt = false

# MIN-4484: called from the browser, so the gateway lets the CORS preflight through; each function
# verifies the session itself (GoTrue + a profile in healthapp_<env> + the role) before anything else.
[functions.healthapp-handshake-create]
verify_jwt = false

[functions.healthapp-handshake-claim]
verify_jwt = false

[functions.healthapp-grant-status]
verify_jwt = false

[functions.healthapp-grant-decide]
verify_jwt = false

[functions.healthapp-grant-revoke]
verify_jwt = false

[functions.healthapp-dashboard-ingest]
verify_jwt = true

[functions.healthapp-dashboard-feed]
verify_jwt = true

[functions.healthapp-demo-login]
verify_jwt = false

# MIN-4475: called from the browser, so the gateway must let the CORS preflight through; each function
# verifies the session itself (GoTrue + a profile in healthapp_<env> + the role) before anything else.
[functions.healthapp-doc-create]
verify_jwt = false

[functions.healthapp-extract-exam]
verify_jwt = false

[functions.healthapp-confirm-doc]
verify_jwt = false

[functions.healthapp-doc-photo]
verify_jwt = false

# MIN-4487: the doctor's assistant. Called from the browser; the function verifies the session, the doctor role and a live grant itself.
[functions.healthapp-assistant]
verify_jwt = false

# MIN-4551: a doctor's numbers over time (plain arithmetic, no model). Called from the browser; the function verifies the session, the doctor role and a live grant itself.
[functions.healthapp-over-time]
verify_jwt = false

# MIN-4662: possible diagnoses for the doctor (a model call on one patient's record, off by default per environment). Called from the browser; the function verifies the session, the doctor role and a live grant itself.
[functions.healthapp-diagnoses]
verify_jwt = false

# MIN-4556: the patient's upload list and delete, called from the browser (the function verifies the session itself).
[functions.healthapp-my-exams]
verify_jwt = false

[functions.healthapp-exam-delete]
verify_jwt = false

# MIN-4556 addendum: the owner takes a saved exam back to a draft, called from the browser (the function verifies the session itself).
[functions.healthapp-unconfirm-doc]
verify_jwt = false

# MIN-4674: the doctor's live simulation run on a boxd machine. Called from the browser; the function verifies the session and the doctor role itself.
[functions.healthapp-simulate-live]
verify_jwt = false
